<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080C0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Élan" />
  <meta name="description" content="Élan — pesée du matin, composition corporelle, sport et objectifs." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./app.css" />
  <title>Élan</title>
</head>
<body>
  <div class="app-ambience" aria-hidden="true"></div>

  <main id="view" class="view"><!-- Les écrans sont rendus ici par app.js --></main>

  <!-- Barre d'onglets -->
  <nav class="tabbar" id="tabbar" aria-label="Navigation principale">
    <button class="tab" data-tab="/" aria-label="Accueil">
      <svg viewBox="0 0 24 24" class="tab-ic"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
      <span>Accueil</span>
    </button>
    <button class="tab" data-tab="/courbes" aria-label="Courbes">
      <svg viewBox="0 0 24 24" class="tab-ic"><path d="M3 17.5 9 11l4 4 8-8.5"/><path d="M21 6.5h-4.5M21 6.5V11"/></svg>
      <span>Courbes</span>
    </button>
    <button class="fab" id="fab" aria-label="Saisir la pesée">
      <svg viewBox="0 0 24 24" class="fab-ic"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="/tableau" aria-label="Tableau">
      <svg viewBox="0 0 24 24" class="tab-ic"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18M3 14.5h18M9 4.5v15"/></svg>
      <span>Tableau</span>
    </button>
    <button class="tab" data-tab="/plus" aria-label="Plus">
      <svg viewBox="0 0 24 24" class="tab-ic"><rect x="4" y="4" width="6" height="6" rx="2"/><rect x="14" y="4" width="6" height="6" rx="2"/><rect x="4" y="14" width="6" height="6" rx="2"/><rect x="14" y="14" width="6" height="6" rx="2"/></svg>
      <span>Plus</span>
    </button>
    <span class="tab-pill" id="tabPill" aria-hidden="true"></span>
  </nav>

  <!-- Conteneurs superposés -->
  <div id="sheet-root" class="sheet-root" aria-hidden="true"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>

  <script src="./app.js" defer></script>
</body>
</html>
